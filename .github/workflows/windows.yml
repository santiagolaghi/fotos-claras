name: Windows · pruebas e instalador beta
on:
  push:
    branches: [main, 'reconstruccion/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-build:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: FotosClaras/requirements.txt
      - name: Instalar dependencias fijadas
        run: python -m pip install -r FotosClaras/requirements.txt pyinstaller==6.19.0
      - name: Pruebas de catálogo, archivos e interfaz Qt
        working-directory: FotosClaras
        run: python -m unittest discover -s tests_v1 -v
      - name: Fotografías reales y modelos reales
        run: python tools/verify_real.py
      - name: Biblioteca de 10000 archivos reales redimensionados
        run: python tools/benchmark.py --files 10000
      - name: Capturas de todas las pantallas y tamaños
        run: python tools/capture_ui.py
      - name: Compilar aplicación Windows
        working-directory: FotosClaras
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name FotosClaras --distpath ../dist --workpath ../build --collect-all cv2 --collect-all pillow_heif app.py
      - name: Compilar lanzador Windows con recuperación
        shell: pwsh
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /out:packaging/FotosClarasLauncher.exe /reference:System.Windows.Forms.dll packaging/Launcher.cs
          if ($LASTEXITCODE -ne 0) { throw 'Launcher compilation failed' }
      - name: Crear instaladores de prueba de actualización
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' '/DAppVersion=0.9.0-beta.0' packaging/FotosClaras.iss
          if ($LASTEXITCODE -ne 0) { throw 'Previous installer compilation failed' }
          Move-Item dist/Fotos-Claras-Setup.exe dist/Fotos-Claras-Previous-Setup.exe
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' '/DAppVersion=0.9.0-beta.1' packaging/FotosClaras.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Instalar, abrir EXE, actualizar y recuperar
        shell: pwsh
        run: ./tools/windows_install_smoke.ps1
      - name: Huella del instalador
        shell: pwsh
        run: (Get-FileHash dist/Fotos-Claras-Setup.exe -Algorithm SHA256).Hash.ToLower() | Set-Content dist/Fotos-Claras-Setup.exe.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-evidencia
          path: |
            validation/*.json
            validation/screenshots/
            validation/installed/
            build/FotosClaras/warn-FotosClaras.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Fotos-Claras-Windows-0.9.0-beta.1
          path: |
            dist/Fotos-Claras-Setup.exe
            dist/Fotos-Claras-Setup.exe.sha256
          retention-days: 30
